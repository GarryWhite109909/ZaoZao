<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevHub 开发者社区</title>
  <!-- 公共 CDN 库：验证扫描器的公共库自动跳过（jQuery 非站点自有攻击面） -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <style>
    body { font-family: -apple-system, "Microsoft YaHei", sans-serif; margin: 0; background: #f6f8fa; color: #1f2328; }
    header { background: #24292f; color: #fff; padding: 12px 24px; font-size: 18px; font-weight: 600; }
    main { max-width: 860px; margin: 24px auto; display: grid; gap: 16px; }
    .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 16px 20px; }
    .card h3 { margin: 0 0 8px; font-size: 15px; }
    .muted { color: #656d76; font-size: 13px; }
    button { background: #1f6feb; color: #fff; border: 0; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
    input { border: 1px solid #d0d7de; border-radius: 6px; padding: 6px 10px; }
    #search-results div, #comment-list div { padding: 6px 8px; border-bottom: 1px solid #eaeef2; }
  </style>
</head>
<body>
<header>DevHub 开发者社区 · 内部演示站</header>
<main>
  <div class="card">
    <h3>帖子搜索</h3>
    <input id="search-input" placeholder="关键词，如 sqlite">
    <button onclick="doSearch()">搜索</button>
    <div id="search-results" class="muted"></div>
  </div>

  <div class="card">
    <h3>欢迎语</h3>
    <div id="welcome-box"></div>
  </div>

  <div class="card">
    <h3>主题配置</h3>
    <div id="theme-box" class="muted">当前主题：default</div>
  </div>

  <div class="card">
    <h3>用户设置合并</h3>
    <div id="settings-box" class="muted">加载中…</div>
  </div>

  <div class="card">
    <h3>评论列表</h3>
    <div id="comment-list"></div>
  </div>
</main>

<script>
// 搜索：结果列表渲染
function doSearch() {
  var kw = document.getElementById('search-input').value;
  fetch('/api/search?q=' + encodeURIComponent(kw)).then(function (r) { return r.json(); })
    .catch(function () { return { items: [{ title: '暂无结果：' + kw, author: 'system' }] }; })
    .then(function (data) {
      var box = document.getElementById('search-results');
      box.innerHTML = '';
      data.items.forEach(function (it) {
        box.innerHTML += '<div><b>' + it.title + '</b> — ' + it.author + '</div>';
      });
    });
}
</script>

<script>
// 欢迎语：从 URL 参数读取用户昵称并渲染
(function () {
  var params = new URLSearchParams(window.location.search);
  var name = params.get('name') || '游客';
  document.write('<div class="muted">欢迎你，' + name + '！今天也要加油写代码。</div>');
})();
</script>

<script>
// 主题配置：支持通过 url 参数传入自定义配置表达式（旧版兼容）
(function () {
  var params = new URLSearchParams(window.location.search);
  var conf = params.get('theme');
  if (conf) {
    try {
      var theme = eval('(' + conf + ')');
      document.getElementById('theme-box').innerHTML =
        '当前主题：' + theme.name + '（作者 ' + theme.author + '）';
    } catch (e) {
      document.getElementById('theme-box').textContent = '配置解析失败';
    }
  }
})();
</script>

<script>
// 用户设置：深合并默认配置与用户配置
function deepMerge(target, src) {
  for (var key in src) {
    if (typeof src[key] === 'object' && src[key] !== null) {
      if (!target[key]) target[key] = {};
      deepMerge(target[key], src[key]);
    } else {
      target[key] = src[key];
    }
  }
  return target;
}
(function () {
  var defaults = { layout: 'list', notify: { email: true } };
  var params = new URLSearchParams(window.location.search);
  var userConf = params.get('settings');
  if (userConf) {
    try {
      var cfg = deepMerge(defaults, JSON.parse(userConf));
      document.getElementById('settings-box').textContent =
        '布局 ' + cfg.layout + ' · 邮件通知 ' + cfg.notify.email;
    } catch (e) {
      document.getElementById('settings-box').textContent = '配置格式错误';
    }
  } else {
    document.getElementById('settings-box').textContent = '布局 list · 邮件通知 true';
  }
})();
</script>

<script>
// 第三方嵌入通信：接收父页面指令刷新评论
window.addEventListener('message', function (event) {
  var msg = event.data;
  if (msg.type === 'refresh-comments') {
    var list = document.getElementById('comment-list');
    list.innerHTML = '';
    msg.comments.forEach(function (c) {
      list.innerHTML += '<div>' + c.author + '：' + c.text + '</div>';
    });
  }
});
</script>

<script>
// 举报提交：全部走 textContent，无注入面（安全对照组）
function submitReport() {
  var reason = document.getElementById('report-input').value;
  var node = document.createElement('span');
  node.textContent = '已收到举报：' + reason;
  document.getElementById('report-box').appendChild(node);
  fetch('/api/report', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ reason: reason, ts: Date.now() })
  });
}
</script>
</body>
</html>
