<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>(function(){try{var k='vuln-theme',s=localStorage.getItem(k),t=(s==='light'||s==='dark')?s:'light';document.documentElement.classList.remove('light','dark');document.documentElement.classList.add(t);}catch(e){document.documentElement.classList.add('light');}})();</script>
    <title>欢迎 · Nivis</title>
    <link rel="stylesheet" href="./design-tokens.css">
    <script src="./lib/tailwind.global.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--vuln-background);
    --color-foreground: var(--vuln-foreground);
    --color-primary: var(--vuln-primary);
    --color-primary-foreground: var(--vuln-primary-foreground);
    --color-muted-foreground: var(--vuln-muted-foreground);
    --color-border: var(--vuln-border);
    --color-ring: var(--vuln-ring);
    --radius-md: var(--vuln-radius-md);
    --radius-lg: var(--vuln-radius-lg);
  }
    </style>
    <link rel="stylesheet" href="./lively.css">
    <style>
      /* === 欢迎页专属样式 === */
      .welcome-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        padding: 24px;
      }

      /* 品牌渐变光晕背景 */
      .welcome-page::before {
        content: '';
        position: absolute;
        top: -20%;
        left: 50%;
        transform: translateX(-50%);
        width: 800px;
        height: 800px;
        background: radial-gradient(circle, color-mix(in srgb, var(--vuln-brand) 12%, transparent) 0%, transparent 60%);
        pointer-events: none;
        z-index: 0;
      }
      .welcome-page::after {
        content: '';
        position: absolute;
        bottom: -10%;
        right: -10%;
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, color-mix(in srgb, var(--vuln-brand-teal) 10%, transparent) 0%, transparent 60%);
        pointer-events: none;
        z-index: 0;
      }

      .welcome-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 560px;
      }

      /* Logo 区域 */
      .welcome-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        margin-bottom: 48px;
        animation: fadeUp 0.7s var(--lv-bounce) 0.1s backwards;
      }
      .welcome-logo .logo-icon {
        width: 88px;
        height: 88px;
        border-radius: var(--vuln-radius-lg);
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--vuln-surface);
        border: 1px solid var(--vuln-line);
        box-shadow: var(--vuln-shadow-3);
        padding: 14px;
      }
      .welcome-logo .logo-icon img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      /* 文字 logo 全页背景水印 */
      .welcome-bg-logo {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 92vw;
        max-width: 1200px;
        z-index: 0;
        pointer-events: none;
        opacity: 0.22;
        animation: welcomeBgFade 1.2s ease-out 0.1s backwards;
      }
      .welcome-bg-logo img {
        width: 100%;
        height: auto;
        object-fit: contain;
        display: block;
      }
      .dark .welcome-bg-logo { opacity: 0.28; }
      @keyframes welcomeBgFade { from { opacity: 0; } }

      /* 欢迎文案 */
      .welcome-text {
        animation: fadeUp 0.7s var(--lv-bounce) 0.25s backwards;
      }
      .welcome-text h1 {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--vuln-ink);
        margin-bottom: 12px;
      }
      .welcome-text p {
        font-size: 16px;
        line-height: 1.7;
        color: var(--vuln-ink-2);
      }

      /* Start 按钮 */
      .start-btn {
        margin-top: 40px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 14px 40px;
        font-size: 16px;
        font-weight: 600;
        color: var(--vuln-brand-ink);
        background: var(--vuln-brand-gradient);
        border: none;
        border-radius: var(--vuln-radius-lg);
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 4px 16px color-mix(in srgb, var(--vuln-brand) 35%, transparent),
                    0 0 0 1px color-mix(in srgb, var(--vuln-brand) 20%, transparent);
        transition: transform 320ms var(--lv-spring) var(--lv-out-delay),
                    box-shadow 320ms var(--lv-spring) var(--lv-out-delay);
        animation: fadeUp 0.7s var(--lv-bounce) 0.4s backwards;
      }
      .start-btn:hover {
        transition-delay: 0ms;
        transform: translateY(-3px);
        box-shadow: 0 8px 28px color-mix(in srgb, var(--vuln-brand) 45%, transparent),
                    0 0 0 1px color-mix(in srgb, var(--vuln-brand) 30%, transparent);
      }
      .start-btn:active {
        transform: scale(0.97);
      }
      .start-btn svg {
        width: 20px;
        height: 20px;
        transition: transform 280ms var(--lv-spring) var(--lv-out-delay);
      }
      .start-btn:hover svg {
        transition-delay: 0ms;
        transform: translateX(4px);
      }

      /* 底部版本信息 */
      .welcome-footer {
        position: absolute;
        bottom: 24px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 12px;
        color: var(--vuln-ink-3);
        z-index: 1;
      }

      /* 主题切换按钮（右上角，与全站一致） */
      .welcome-topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        display: flex;
        justify-content: flex-end;
        padding: 20px 24px;
      }

      @media (max-width: 640px) {
        .welcome-text h1 { font-size: 26px; }
        .welcome-text p { font-size: 14px; }
        .welcome-logo { margin-bottom: 36px; }
        .welcome-logo .logo-icon { width: 72px; height: 72px; }
        .start-btn { padding: 12px 32px; font-size: 15px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .welcome-logo, .welcome-text, .start-btn, .welcome-bg-logo { animation: none; }
      }
    </style>
</head>
<body>
    <div class="welcome-topbar">
      <button id="theme-toggle" class="nav-btn" type="button" aria-label="切换主题"></button>
    </div>

    <div class="welcome-page">
      <!-- 文字 logo 作为全页背景水印 -->
      <div class="welcome-bg-logo" aria-hidden="true">
        <img src="./logo/文字logo.png" class="logo-light" alt="" />
        <img src="./logo/文字logo深色版.png" class="logo-dark" alt="" />
      </div>

      <div class="welcome-content">
        <!-- 图标 logo -->
        <div class="welcome-logo">
          <div class="logo-icon">
            <img src="./logo/图标logo.png" class="logo-light" alt="Nivis" />
            <img src="./logo/图标logo深色版.png" class="logo-dark" alt="Nivis" />
          </div>
        </div>

        <!-- 欢迎文案 -->
        <div class="welcome-text">
          <h1>欢迎进入 Nivis</h1>
          <p>请点击下方按钮移步到应用页面，开始你的代码安全分析之旅</p>
        </div>

        <!-- Start 按钮 -->
        <a href="./index.html" class="start-btn">
          <span>Start</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"/>
            <path d="m12 5 7 7-7 7"/>
          </svg>
        </a>
      </div>

      <div class="welcome-footer">
        © 2026 Nivis · AI 代码漏洞静态分析平台 · 数据仅用于本地安全分析
      </div>
    </div>

    <script src="./theme.js" defer></script>
</body>
</html>
