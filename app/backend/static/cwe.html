  @theme inline {
    --color-background: var(--vuln-background);
    --color-foreground: var(--vuln-foreground);
    --color-card: var(--vuln-card);
    --color-card-foreground: var(--vuln-card-foreground);
    --color-popover: var(--vuln-popover);
    --color-popover-foreground: var(--vuln-popover-foreground);
    --color-primary: var(--vuln-primary);
    --color-primary-foreground: var(--vuln-primary-foreground);
    --color-muted: var(--vuln-muted);
    --color-muted-foreground: var(--vuln-muted-foreground);
    --color-border: var(--vuln-border);
    --color-input: var(--vuln-input);
    --color-ring: var(--vuln-ring);
    --radius-sm: var(--vuln-radius-sm);
    --radius-md: var(--vuln-radius-md);
    --radius-lg: var(--vuln-radius-lg);
  }
  @layer base {
    body { background: var(--vuln-background); color: var(--vuln-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

<body class="min-h-screen font-sans antialiased">
  <style id="critical-layout">
    .cwe-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }
    .cwe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr));
      gap: 1.25rem;
    }
    @media (max-width: 640px) {
      .cwe-grid { grid-template-columns: 1fr; }
    }

    /* === 详情弹窗 === */
    .cwe-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.6);
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .cwe-modal-overlay.open { display: flex; }
    .cwe-modal {
      background: var(--vuln-surface);
      border: 1px solid var(--vuln-line);
      border-radius: 12px;
      max-width: 48rem;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: var(--vuln-shadow-3);
      animation: cwe-modal-in 0.18s ease-out;
    }
    @keyframes cwe-modal-in {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* === 代码块 === */
    .cwe-code-block {
      background: var(--vuln-bg);
      border: 1px solid var(--vuln-line);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      overflow-x: auto;
      font-family: var(--vuln-font-mono);
      font-size: 0.8125rem;
      line-height: 1.6;
      color: var(--vuln-ink);
      white-space: pre;
      tab-size: 2;
    }
    .cwe-code-block.vuln { border-left: 3px solid var(--vuln-state-error); }
    .cwe-code-block.safe { border-left: 3px solid var(--vuln-state-success); }
  </style>
  <style id="enhanced-effects">
    /* :root 变量、@keyframes fadeUp/shimmer/pulseBorder、::-webkit-scrollbar、prefers-reduced-motion
       均已统一到 lively.css 全局，此处仅保留页面特有样式 */

    /* .glass-card / .nav-glass / button / a 统一由 lively.css 管理，此处不再覆盖 */

    /* Smooth card filtering transition instead of hard display:none */
    .cwe-card {
      animation: fadeUp 0.5s var(--lv-bounce) backwards;
      transition: opacity 0.2s var(--lv-smooth),
                  transform 320ms var(--lv-spring) var(--lv-out-delay),
                  box-shadow 320ms var(--lv-spring) var(--lv-out-delay),
                  border-color 250ms var(--lv-smooth) var(--lv-out-delay);
    }
    .cwe-card.filtered-out {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
      position: absolute;
      visibility: hidden;
    }
    .cwe-card:hover { transition-delay: 0ms; transform: translateY(-4px); }

    /* :focus-visible / button / a / .glass-card / .icon-box 统一由 lively.css 管理 */

    .view-detail { transition: transform 280ms var(--lv-spring) var(--lv-out-delay), color 200ms var(--lv-smooth) var(--lv-out-delay); }
    .view-detail:hover { transition-delay: 0ms; transform: translateX(5px); }
  </style>

      /* ---------- 状态 ---------- */
      var state = { search: '', severity: 'all' };

      /* ---------- DOM 引用 ---------- */
      var $grid = document.getElementById('cwe-grid');
      var $stats = document.getElementById('cwe-stats');
      var $footerCount = document.getElementById('cwe-footer-count');
      var $empty = document.getElementById('cwe-empty');
      var $search = document.getElementById('search-cwe');
      var $overlay = document.getElementById('cwe-modal-overlay');

      /* ---------- 渲染卡片 ---------- */
      function langSpans(langs) {
        return langs.map(function (l) {
          return '<span class="text-xs px-2 py-0.5 rounded bg-[var(--vuln-surface-2)] text-[var(--vuln-ink-2)] border border-[var(--vuln-line)]">' + escapeHtml(l) + '</span>';
        }).join('');
      }

      function renderCards() {
        var html = CWE_DATA.map(function (c, i) {
          var meta = SEVERITY_META[c.severity] || SEVERITY_META.info;
          return '' +
            '<article class="cwe-card glass-card group rounded-lg p-5" data-severity="' + escapeHtml(c.severity) + '" data-cwe-id="' + escapeHtml(c.id) + '" style="animation-delay: ' + (i * 50) + 'ms;">' +
              '<div class="flex items-start justify-between mb-3">' +
                '<span data-cwe-id-span class="inline-flex items-center px-2 py-1 rounded-md bg-[var(--vuln-surface-2)] border border-[var(--vuln-line)] text-[var(--vuln-brand)] font-mono text-xs font-semibold">' + escapeHtml(c.id) + '</span>' +
                '<span class="severity-badge inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium ' + meta.badge + '">' + escapeHtml(meta.label) + '</span>' +
              '</div>' +
              '<h2 class="text-base font-semibold text-[var(--vuln-ink)] mb-2">' + escapeHtml(c.name) + '</h2>' +
              '<p class="text-sm text-[var(--vuln-ink-2)] mb-4 leading-relaxed">' + escapeHtml(c.description) + '</p>' +
              '<div class="flex flex-wrap gap-2 mb-4" aria-label="受影响语言">' + langSpans(c.languages) + '</div>' +
              '<a href="#" data-cwe-id="' + escapeHtml(c.id) + '" class="view-detail inline-flex items-center gap-1 text-sm font-medium text-[var(--vuln-brand)] hover:text-[var(--vuln-brand-300)] transition-colors">' +
                '查看详情' +
                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                  '<path d="M5 12h14"/>' +
                  '<path d="m12 5 7 7-7 7"/>' +
                '</svg>' +
              '</a>' +
            '</article>';
        }).join('');
        $grid.innerHTML = html;
      }

      /* ---------- 筛选 ---------- */
      function applyFilters() {
        var search = state.search.trim().toLowerCase();
        var sev = state.severity;
        var cards = $grid.querySelectorAll('.cwe-card');
        var shown = 0;

        cards.forEach(function (card) {
          var cweId = card.getAttribute('data-cwe-id') || '';
          var cwe = null;
          for (var i = 0; i < CWE_DATA.length; i++) {
            if (CWE_DATA[i].id === cweId) { cwe = CWE_DATA[i]; break; }
          }
          var name = cwe ? cwe.name.toLowerCase() : '';
          var desc = cwe ? cwe.description.toLowerCase() : '';
          var category = cwe ? cwe.category.toLowerCase() : '';
          var cardSev = card.getAttribute('data-severity') || '';

          var matchSearch = !search ||
            cweId.toLowerCase().indexOf(search) > -1 ||
            name.indexOf(search) > -1 ||
            desc.indexOf(search) > -1 ||
            category.indexOf(search) > -1;
          var matchSev = sev === 'all' || cardSev === sev;

          if (matchSearch && matchSev) {
            card.classList.remove('filtered-out');
            shown++;
          } else {
            card.classList.add('filtered-out');
          }
        });

        $stats.textContent = '共 ' + CWE_DATA.length + ' 个 CWE · 显示 ' + shown + ' 个';
        $footerCount.textContent = '共 ' + CWE_DATA.length + ' 个 CWE 条目 · 暗色赛博安全样本库';
        /* 空态元素带 Tailwind .hidden（class 的 display:none 优先级高于
           style.display=''），必须操作 class 而非内联 style，否则永不显示 */
        $empty.classList.toggle('hidden', shown !== 0);
      }

      /* ---------- chip 样式同步（按 severity 分色） ---------- */
      var SEV_COLORS = {
        'all':    ['var(--vuln-brand)', 'var(--vuln-brand-ink)', 'var(--vuln-brand)'],
        'high':   ['var(--vuln-state-error)', '#fff', 'var(--vuln-state-error)'],
        'medium': ['var(--vuln-state-warning)', '#1a1a1a', 'var(--vuln-state-warning)'],
        'low':    ['var(--vuln-state-success)', '#fff', 'var(--vuln-state-success)'],
        'info':   ['var(--vuln-state-info)', '#fff', 'var(--vuln-state-info)'],
      };
      function styleChip(chip) {
        if (chip.classList.contains('active')) {
          var sev = chip.getAttribute('data-severity') || 'all';
          var c = SEV_COLORS[sev] || SEV_COLORS['all'];
          chip.style.backgroundColor = c[0];
          chip.style.color = c[1];
          chip.style.borderColor = c[2];
        } else {
          chip.style.backgroundColor = 'var(--vuln-surface-2)';
          chip.style.color = 'var(--vuln-ink-2)';
          chip.style.borderColor = 'var(--vuln-line)';
        }
      }

      function syncChips() {
        var chips = document.querySelectorAll('.filter-chip');
        chips.forEach(function (chip) {
          var active = chip.getAttribute('data-severity') === state.severity;
          chip.classList.toggle('active', active);
          styleChip(chip);
        });
      }

      /* ---------- 详情弹窗 ---------- */
      function openModal(cweId) {
        var cwe = null;
        for (var i = 0; i < CWE_DATA.length; i++) {
          if (CWE_DATA[i].id === cweId) { cwe = CWE_DATA[i]; break; }
        }
        if (!cwe) return;

        var meta = SEVERITY_META[cwe.severity] || SEVERITY_META.info;

        document.getElementById('modal-cwe-id').textContent = cwe.id;

        var sevEl = document.getElementById('modal-cwe-sev');
        sevEl.textContent = meta.label;
        sevEl.className = 'severity-badge inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium ' + meta.badge;

        document.getElementById('modal-cwe-category').textContent = '· ' + cwe.category;
        document.getElementById('modal-cwe-title').textContent = cwe.name;
        document.getElementById('modal-cwe-desc').textContent = cwe.description;
        document.getElementById('modal-cwe-detection').textContent = cwe.detection;
        document.getElementById('modal-cwe-fix').textContent = cwe.fix;

        // 代码块通过 textContent 写入，天然防 XSS
        document.getElementById('modal-cwe-vuln-code').textContent = cwe.vulnCode.code;
        document.getElementById('modal-cwe-vuln-lang').textContent = cwe.vulnCode.lang;
        document.getElementById('modal-cwe-safe-code').textContent = cwe.safeCode.code;
        document.getElementById('modal-cwe-safe-lang').textContent = cwe.safeCode.lang;

        // 受影响语言
        var langsBox = document.getElementById('modal-cwe-langs');
        langsBox.innerHTML = langSpans(cwe.languages);

        $overlay.classList.add('open');
        $overlay.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }

      function closeModal() {
        $overlay.classList.remove('open');
        $overlay.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      /* ---------- 事件绑定 ---------- */
      // 搜索
      $search.addEventListener('input', function (e) {
        state.search = e.target.value;
        applyFilters();
      });

      // chip 筛选
      var chips = document.querySelectorAll('.filter-chip');
      chips.forEach(function (chip) {
        chip.addEventListener('click', function () {
          state.severity = chip.getAttribute('data-severity') || 'all';
          syncChips();
          applyFilters();
        });
      });

      // 卡片"查看详情"（事件委托）
      $grid.addEventListener('click', function (e) {
        var link = e.target.closest('.view-detail');
        if (link) {
          e.preventDefault();
          openModal(link.getAttribute('data-cwe-id'));
        }
      });

      // 弹窗关闭
      document.getElementById('modal-close').addEventListener('click', closeModal);
      $overlay.addEventListener('click', function (e) {
        if (e.target === $overlay) closeModal();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && $overlay.classList.contains('open')) {
          closeModal();
        }
      });

      /* ---------- 初始化 ---------- */
      renderCards();
      syncChips();
      applyFilters();

      /* ---------- 扫描历史检测标记 ---------- */
      // 从 localStorage 读取扫描历史，标记哪些 CWE 在最近扫描中被检测到
      function getDetectedCwes() {
        try {
          var raw = localStorage.getItem('vuln_scan_history');
          if (!raw) return {};
          var hist = JSON.parse(raw);
          if (!Array.isArray(hist)) return {};
          var detected = {};
          for (var i = 0; i < hist.length; i++) {
            var results = hist[i].results;
            if (!Array.isArray(results)) continue;
            for (var j = 0; j < results.length; j++) {
              if (results[j] && results[j].has_vulnerability === true) {
                var vt = String(results[j].vulnerability_type || '').toLowerCase();
                // 映射漏洞类型到 CWE ID
                for (var k = 0; k < CWE_DATA.length; k++) {
                  var cwe = CWE_DATA[k];
                  if (vt.indexOf(cwe.id.toLowerCase()) > -1 ||
                      vt.indexOf(cwe.name.toLowerCase()) > -1) {
                    detected[cwe.id] = (detected[cwe.id] || 0) + 1;
                  }
                }
              }
            }
          }
          return detected;
        } catch (e) { return {}; }
      }

      function applyDetectedBadges() {
        var detected = getDetectedCwes();
        var count = Object.keys(detected).length;
        if (count === 0) return;
        // 显示汇总
        var summary = document.getElementById('detected-summary');
        if (summary) {
          summary.textContent = '最近扫描中发现 ' + count + ' 类 CWE';
          summary.classList.remove('hidden');
          summary.style.color = 'var(--vuln-state-error)';
        }
        // 在卡片上添加检测标记
        var cards = $grid.querySelectorAll('.cwe-card');
        cards.forEach(function (card) {
          var cweId = card.getAttribute('data-cwe-id');
          if (detected[cweId]) {
            var badge = document.createElement('span');
            badge.className = 'inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full text-xs font-medium bg-[var(--vuln-state-error)]/10 text-[var(--vuln-state-error)] border border-[var(--vuln-state-error)]/20';
            badge.style.marginLeft = '6px';
            badge.textContent = '近期发现 ' + detected[cweId] + ' 次';
            var idSpan = card.querySelector('[data-cwe-id-span]');
            if (idSpan) idSpan.parentElement.appendChild(badge);
          }
        });
      }

      applyDetectedBadges();
      loadDemoManifest();

      /* ---------- 快速演示链接 ---------- */
      var demoManifest = null;
      function loadDemoManifest() {
        fetch('/samples/demo/manifest.json')
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(function (data) {
            demoManifest = data;
            applyDemoLinks();
          })
          .catch(function (err) { console.error('CWE demo manifest', err); });
      }
      function applyDemoLinks() {
        if (!demoManifest || !demoManifest.samples) return;
        var byCwe = {};
        demoManifest.samples.forEach(function (s) {
          var cwe = s.expected_cwe;
          if (!cwe || cwe === 'N/A') return;
          if (!byCwe[cwe]) byCwe[cwe] = [];
          byCwe[cwe].push(s);
        });
        var cards = document.querySelectorAll('.cwe-card');
        cards.forEach(function (card) {
          var cweId = card.getAttribute('data-cwe-id');
          var list = byCwe[cweId];
          if (!list || !list.length) return;
          var footer = card.querySelector('.view-detail');
          if (!footer) return;
          var link = document.createElement('a');
          link.href = './scan.html?demo=' + encodeURIComponent(list[0].file);
          link.className = 'demo-link inline-flex items-center gap-1 text-xs font-medium text-[var(--vuln-brand)] hover:text-[var(--vuln-brand-300)] transition-colors ml-3';
          link.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>快速演示' + (list.length > 1 ? ' (' + list.length + ')' : '');
          footer.parentNode.appendChild(link);
        });
      }
    })();
  </script>

<script src="./backend-badge.js" defer></script>
<script src="./theme.js" defer></script>
</body>
</html>
