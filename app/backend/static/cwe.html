    <style id="theme-vars">
/* Vuln Scanner UI — Google-style clean analytical dashboard tokens */
/* Light mode: white-paper clarity with #4285f4 primary; Dark mode: editorial high-contrast with #fc2c50 primary */

:root {
  /* Neutral scale — light mode */
  --vuln-bg: #ffffff;
  --vuln-surface: #ffffff;
  --vuln-surface-2: #f9f9fa;
  --vuln-ink: #0e1115;
  --vuln-ink-2: #7f8d9f;
  --vuln-ink-3: #b0b8c2;
  --vuln-line: #ebebeb;

  /* Brand primary — Google blue */
  --vuln-brand: #4285f4;
  --vuln-brand-ink: #ffffff;
  --vuln-brand-50: #eff6ff;
  --vuln-brand-100: #dbeafe;
  --vuln-brand-200: #bfdbfe;
  --vuln-brand-300: #93c5fd;
  --vuln-brand-400: #60a5fa;
  --vuln-brand-500: #4285f4;
  --vuln-brand-600: #2563eb;
  --vuln-brand-700: #1d4ed8;

  /* Semantic state colors — Google palette */
  --vuln-state-success: #34a853;
  --vuln-state-warning: #fbbc05;
  --vuln-state-error: #ea4335;
  --vuln-state-info: #4285f4;

  /* Semantic aliases required by head contract */
  --vuln-background: var(--vuln-bg);
  --vuln-foreground: var(--vuln-ink);
  --vuln-card: var(--vuln-surface);
  --vuln-card-foreground: var(--vuln-ink);
  --vuln-popover: var(--vuln-surface-2);
  --vuln-popover-foreground: var(--vuln-ink);
  --vuln-primary: var(--vuln-brand);
  --vuln-primary-foreground: var(--vuln-brand-ink);
  --vuln-muted: var(--vuln-surface-2);
  --vuln-muted-foreground: var(--vuln-ink-2);
  --vuln-border: var(--vuln-line);
  --vuln-input: #e2e3e4;
  --vuln-ring: var(--vuln-brand-500);
  --vuln-radius-small: 4px;
  --vuln-radius-medium: 8px;
  --vuln-radius-large: 12px;

  /* Spacing */
  --vuln-s-1: 4px;
  --vuln-s-2: 8px;
  --vuln-s-3: 12px;
  --vuln-s-4: 16px;
  --vuln-s-5: 24px;
  --vuln-s-6: 32px;
  --vuln-s-7: 48px;
  --vuln-s-8: 80px;

  /* Typography — DM Sans for UI, JetBrains Mono for code/data */
  --vuln-font-sans: DM Sans, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
  --vuln-font-mono: JetBrains Mono, "Cascadia Code", Consolas, Monaco, "Courier New", monospace;

  /* Shadows — flat, border-led hierarchy */
  --vuln-shadow-1: 0 1px 2px rgba(14, 17, 21, 0.03);
  --vuln-shadow-2: 0 1px 3px rgba(14, 17, 21, 0.05);
  --vuln-shadow-3: 0 4px 12px rgba(14, 17, 21, 0.05);
}

/* Dark mode — editorial high-contrast */
.dark {
  /* Neutral scale */
  --vuln-bg: #161616;
  --vuln-surface: #1d1d1c;
  --vuln-surface-2: #2e2e2e;
  --vuln-ink: #eff1f4;
  --vuln-ink-2: #949494;
  --vuln-ink-3: #707070;
  --vuln-line: #404040;

  /* Brand primary — electric red */
  --vuln-brand: #fc2c50;
  --vuln-brand-ink: #ffffff;
  --vuln-brand-50: #4a2026;
  --vuln-brand-100: #5c2830;
  --vuln-brand-200: #7a333e;
  --vuln-brand-300: #a34452;
  --vuln-brand-400: #d14f62;
  --vuln-brand-500: #fc2c50;
  --vuln-brand-600: #ff4d6d;
  --vuln-brand-700: #ff6b85;

  /* Semantic state colors */
  --vuln-state-success: #baf6f0;
  --vuln-state-warning: #fbeb35;
  --vuln-state-error: #f1204a;
  --vuln-state-info: #2dccd3;

  /* Semantic aliases */
  --vuln-background: var(--vuln-bg);
  --vuln-foreground: var(--vuln-ink);
  --vuln-card: var(--vuln-surface);
  --vuln-card-foreground: var(--vuln-ink);
  --vuln-popover: var(--vuln-surface-2);
  --vuln-popover-foreground: var(--vuln-ink);
  --vuln-primary: var(--vuln-brand);
  --vuln-primary-foreground: var(--vuln-brand-ink);
  --vuln-muted: var(--vuln-surface-2);
  --vuln-muted-foreground: var(--vuln-ink-2);
  --vuln-border: var(--vuln-line);
  --vuln-input: #000000;
  --vuln-ring: #ffffff;

  /* Shadows remain flat */
  --vuln-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.05);
  --vuln-shadow-2: 0 1px 3px rgba(0, 0, 0, 0.05);
  --vuln-shadow-3: 0 4px 12px rgba(0, 0, 0, 0.05);
}

/* Base typography classes */
.vuln-font-sans { font-family: var(--vuln-font-sans); }
.vuln-font-mono { font-family: var(--vuln-font-mono); }

<body class="min-h-screen font-sans antialiased">
  <style id="critical-layout">
    .cwe-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }
    .cwe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr));
      gap: 1.25rem;
    }
    @media (max-width: 640px) {
      .cwe-grid { grid-template-columns: 1fr; }
    }

    /* === 详情弹窗 === */
    .cwe-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.6);
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .cwe-modal-overlay.open { display: flex; }
    .cwe-modal {
      background: var(--vuln-surface);
      border: 1px solid var(--vuln-line);
      border-radius: 12px;
      max-width: 48rem;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: var(--vuln-shadow-3);
      animation: cwe-modal-in 0.18s ease-out;
    }
    @keyframes cwe-modal-in {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* === 代码块 === */
    .cwe-code-block {
      background: var(--vuln-bg);
      border: 1px solid var(--vuln-line);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      overflow-x: auto;
      font-family: var(--vuln-font-mono);
      font-size: 0.8125rem;
      line-height: 1.6;
      color: var(--vuln-ink);
      white-space: pre;
      tab-size: 2;
    }
    .cwe-code-block.vuln { border-left: 3px solid var(--vuln-state-error); }
    .cwe-code-block.safe { border-left: 3px solid var(--vuln-state-success); }
  </style>
  <style id="enhanced-effects">
    :root {
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
      --dur-fast: 150ms;
      --dur-normal: 350ms;
      --dur-slow: 600ms;
    }

    body {
      background: radial-gradient(ellipse at top, rgba(66,133,244,0.03), transparent 60%);
    }
    .dark body {
      background: radial-gradient(ellipse at top, rgba(252,44,80,0.04), transparent 60%);
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(200%); } }
    @keyframes pulseBorder { 0%, 100% { border-color: var(--vuln-line); } 50% { border-color: var(--vuln-brand-300); } }

    .glass-card {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 8px 32px rgba(14,17,21,0.06);
      transition: transform var(--dur-normal) var(--ease-spring), box-shadow var(--dur-normal) var(--ease-smooth), border-color var(--dur-normal) var(--ease-smooth), opacity var(--dur-normal) var(--ease-smooth);
    }
    .glass-card:hover {
      transform: translateY(-4px) scale(1.005);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 12px 40px rgba(14,17,21,0.10);
      border-color: rgba(66,133,244,0.3);
    }
    .dark .glass-card {
      background: rgba(29,29,28,0.72);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 8px 32px rgba(0,0,0,0.2);
    }
    .dark .glass-card:hover {
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 12px 40px rgba(0,0,0,0.35);
      border-color: rgba(252,44,80,0.3);
    }

    .nav-glass {
      background: rgba(255,255,255,0.8) !important;
      backdrop-filter: blur(32px) saturate(200%);
      -webkit-backdrop-filter: blur(32px) saturate(200%);
    }
    .dark .nav-glass { background: rgba(22,22,22,0.8) !important; }

    button {
      transition: transform var(--dur-fast) var(--ease-spring), background-color var(--dur-normal) var(--ease-smooth), color var(--dur-normal) var(--ease-smooth), box-shadow var(--dur-normal) var(--ease-smooth), opacity var(--dur-fast) var(--ease-smooth);
    }
    button:active { transform: scale(0.96); }
    a { transition: transform var(--dur-fast) var(--ease-spring), color var(--dur-normal) var(--ease-smooth), background-color var(--dur-normal) var(--ease-smooth); }
    a:active { transform: scale(0.96); }

    .filter-chip { transition: all var(--dur-normal) var(--ease-spring); }
    .filter-chip.active { background: var(--vuln-brand) !important; color: var(--vuln-brand-ink) !important; border-color: var(--vuln-brand) !important; }
    .filter-chip:not(.active):hover { background: var(--vuln-surface-2); transform: translateY(-1px); }

    /* Smooth card filtering transition instead of hard display:none */
    .cwe-card {
      animation: fadeUp 0.4s var(--ease-spring) both;
      transition: opacity 0.2s var(--ease-smooth), transform 0.2s var(--ease-smooth);
    }
    .cwe-card.filtered-out {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
      position: absolute;
      visibility: hidden;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--vuln-ink-3); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--vuln-ink-2); }

    :focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(66,133,244,0.2); }
    .dark :focus-visible { box-shadow: 0 0 0 3px rgba(252,44,80,0.25); }

    /* === 灵动交互增强 — 弹跳/浮起/旋转 === */
    .cwe-card { transition: transform 0.35s var(--ease-spring), opacity 0.2s var(--ease-smooth) !important; }
    .glass-card:hover { transform: translateY(-8px) scale(1.025) !important; box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 20px 50px rgba(14,17,21,0.14) !important; }
    .dark .glass-card:hover { box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 20px 50px rgba(0,0,0,0.4) !important; }
    .cwe-card:hover { transform: translateY(-8px) scale(1.03) !important; }
    button:hover { transform: translateY(-2px); }
    button:active { transform: scale(0.92); }
    a:active { transform: scale(0.93); }
    .filter-chip:not(.active):hover { transform: translateY(-3px) scale(1.06) !important; box-shadow: 0 8px 20px rgba(66,133,244,0.18); }
    .dark .filter-chip:not(.active):hover { box-shadow: 0 8px 20px rgba(252,44,80,0.18); }
    .filter-chip.active { transform: scale(1.06); }
    .icon-box:hover { transform: scale(1.15) rotate(-6deg) !important; }
    .view-detail:hover { transform: translateX(4px); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>

          safeCode: { lang: 'javascript', code: '// 安全代码：查询时关联当前用户\nconst id = req.params.id;\nconst order = await db.order.findFirst({\n  where: { id, userId: req.user.id }\n});\nres.json(order);' }
        },
        {
          id: 'CWE-798',
          name: '硬编码凭证',
          severity: 'low',
          category: '配置类',
          languages: ['通用', 'JavaScript', 'Python'],
          description: '源代码、配置文件或客户端资源中硬编码了密码、API 密钥或令牌，增加凭证泄露与横向移动风险。',
          detection: '检测要点：源码中出现明文密码/密钥字符串；配置文件提交到版本库；前端代码包含 API Secret；凭证使用低熵默认值。',
          fix: '修复建议：凭证存放在环境变量或密钥管理系统（Vault/KMS）；配置文件加入 .gitignore；使用动态密钥轮换；CI 阶段扫描硬编码凭证。',
          vulnCode: { lang: 'javascript', code: '// 漏洞代码：硬编码 API 密钥\nconst API_KEY = "YOUR_API_KEY_HERE";\nfetch("https://api.pay.com", {\n  headers: { Authorization: "Bearer " + API_KEY }\n});' },
          safeCode: { lang: 'javascript', code: '// 安全代码：从环境变量读取\nconst API_KEY = process.env.PAY_API_KEY;\nfetch("https://api.pay.com", {\n  headers: { Authorization: "Bearer " + API_KEY }\n});' }
        },
        {
          id: 'CWE-327',
          name: '使用弱加密算法',
          severity: 'medium',
          category: '加密类',
          languages: ['通用', 'Java', 'Python'],
          description: '系统使用了已被认为不安全的加密算法或过短的密钥长度，无法提供预期的机密性与完整性保护。',
          detection: '检测要点：使用 MD5/SHA1 作为密码哈希；使用 DES/3DES/RC4 或 ECB 模式；RSA 密钥长度小于 2048；使用自定义加密算法。',
          fix: '修复建议：密码使用 bcrypt/scrypt/argon2 带盐；对称加密使用 AES-256-GCM 或 ChaCha20；RSA 密钥长度至少 2048；使用标准库而非自实现算法。',
          vulnCode: { lang: 'java', code: '// 漏洞代码：使用 MD5 校验密码\nimport java.security.MessageDigest;\nString hash = MessageDigest.getInstance("MD5")\n  .digest(password.getBytes()).toString();' },
          safeCode: { lang: 'java', code: '// 安全代码：使用 BCrypt 带盐\nimport org.mindrot.jbcrypt.BCrypt;\nString hash = BCrypt.hashpw(\n  password, BCrypt.gensalt(12));' }
        },
        {
          id: 'CWE-295',
          name: '证书校验不当',
          severity: 'medium',
          category: '加密类',
          languages: ['Python', 'Java', 'Node.js'],
          description: '应用在建立 TLS 连接时未正确校验服务器证书，导致中间人攻击可截获或篡改通信内容。',
          detection: '检测要点：代码中设置 verify=False / TrustAllCerts / InsecureSkipVerify；未校验证书主机名；使用默认允许所有证书的 TrustManager；忽略 SSL 错误继续连接。',
          fix: '修复建议：使用系统默认证书校验；证书钉选（pinning）加强校验；禁止覆盖 TrustManager 为接受所有；校验证书链与主机名。',
          vulnCode: { lang: 'python', code: '# 漏洞代码：关闭证书校验\nimport requests\nr = requests.get(url, verify=False)' },
          safeCode: { lang: 'python', code: '# 安全代码：启用证书校验\nimport requests\nr = requests.get(url, verify=True)' }
        },
        {
          id: 'CWE-384',
          name: '会话固定',
          severity: 'medium',
          category: '认证类',
          languages: ['Web', 'PHP', 'Java'],
          description: '应用在用户登录前后未轮换会话标识符，攻击者可预先植入会话 ID 实现会话固定攻击。',
          detection: '检测要点：登录成功后未调用 invalidate/session_regenerate；会话 ID 可由 URL 传入；登录前后会话 ID 不变；Cookie 未设置 HttpOnly/Secure。',
          fix: '修复建议：登录成功后重新生成会话 ID；禁用 URL 会话 ID；Cookie 设置 HttpOnly、Secure、SameSite；登录后清除旧会话数据。',
          vulnCode: { lang: 'php', code: '// 漏洞代码：登录后不重置会话 ID\nsession_start();\nif (check_password($user, $pass)) {\n  $_SESSION["user"] = $user;\n}' },
          safeCode: { lang: 'php', code: '// 安全代码：登录后重新生成会话 ID\nsession_start();\nif (check_password($user, $pass)) {\n  session_regenerate_id(true);\n  $_SESSION["user"] = $user;\n}' }
        }
      ];

      /* ---------- 状态 ---------- */
      var state = { search: '', severity: 'all' };

      /* ---------- DOM 引用 ---------- */
      var $grid = document.getElementById('cwe-grid');
      var $stats = document.getElementById('cwe-stats');
      var $footerCount = document.getElementById('cwe-footer-count');
      var $empty = document.getElementById('cwe-empty');
      var $search = document.getElementById('search-cwe');
      var $overlay = document.getElementById('cwe-modal-overlay');

      /* ---------- 渲染卡片 ---------- */
      function langSpans(langs) {
        return langs.map(function (l) {
          return '<span class="text-xs px-2 py-0.5 rounded bg-[var(--vuln-surface-2)] text-[var(--vuln-ink-2)] border border-[var(--vuln-line)]">' + escapeHtml(l) + '</span>';
        }).join('');
      }

      function renderCards() {
        var html = CWE_DATA.map(function (c, i) {
          var meta = SEVERITY_META[c.severity] || SEVERITY_META.info;
          return '' +
            '<article class="cwe-card glass-card group rounded-lg p-5" data-severity="' + escapeHtml(c.severity) + '" data-cwe-id="' + escapeHtml(c.id) + '" style="animation-delay: ' + (i * 50) + 'ms;">' +
              '<div class="flex items-start justify-between mb-3">' +
                '<span class="inline-flex items-center px-2 py-1 rounded-md bg-[var(--vuln-surface-2)] border border-[var(--vuln-line)] text-[var(--vuln-brand)] font-mono text-xs font-semibold">' + escapeHtml(c.id) + '</span>' +
                '<span class="severity-badge inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium ' + meta.badge + '">' + escapeHtml(meta.label) + '</span>' +
              '</div>' +
              '<h2 class="text-base font-semibold text-[var(--vuln-ink)] mb-2">' + escapeHtml(c.name) + '</h2>' +
              '<p class="text-sm text-[var(--vuln-ink-2)] mb-4 leading-relaxed">' + escapeHtml(c.description) + '</p>' +
              '<div class="flex flex-wrap gap-2 mb-4" aria-label="受影响语言">' + langSpans(c.languages) + '</div>' +
              '<a href="#" data-cwe-id="' + escapeHtml(c.id) + '" class="view-detail inline-flex items-center gap-1 text-sm font-medium text-[var(--vuln-brand)] hover:text-[var(--vuln-brand-300)] transition-colors">' +
                '查看详情' +
                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                  '<path d="M5 12h14"/>' +
                  '<path d="m12 5 7 7-7 7"/>' +
                '</svg>' +
              '</a>' +
            '</article>';
        }).join('');
        $grid.innerHTML = html;
      }

      /* ---------- 筛选 ---------- */
      function applyFilters() {
        var search = state.search.trim().toLowerCase();
        var sev = state.severity;
        var cards = $grid.querySelectorAll('.cwe-card');
        var shown = 0;

        cards.forEach(function (card) {
          var cweId = card.getAttribute('data-cwe-id') || '';
          var cwe = null;
          for (var i = 0; i < CWE_DATA.length; i++) {
            if (CWE_DATA[i].id === cweId) { cwe = CWE_DATA[i]; break; }
          }
          var name = cwe ? cwe.name.toLowerCase() : '';
          var desc = cwe ? cwe.description.toLowerCase() : '';
          var category = cwe ? cwe.category.toLowerCase() : '';
          var cardSev = card.getAttribute('data-severity') || '';

          var matchSearch = !search ||
            cweId.toLowerCase().indexOf(search) > -1 ||
            name.indexOf(search) > -1 ||
            desc.indexOf(search) > -1 ||
            category.indexOf(search) > -1;
          var matchSev = sev === 'all' || cardSev === sev;

          if (matchSearch && matchSev) {
            card.classList.remove('filtered-out');
            shown++;
          } else {
            card.classList.add('filtered-out');
          }
        });

        $stats.textContent = '共 ' + CWE_DATA.length + ' 个 CWE · 显示 ' + shown + ' 个';
        $footerCount.textContent = '共 ' + CWE_DATA.length + ' 个 CWE 条目 · 暗色赛博安全样本库';
        $empty.style.display = shown === 0 ? '' : 'none';
      }

      /* ---------- chip 样式同步 ---------- */
      function styleChip(chip) {
        if (chip.classList.contains('active')) {
          chip.style.backgroundColor = 'var(--vuln-brand)';
          chip.style.color = 'var(--vuln-brand-ink)';
          chip.style.borderColor = 'var(--vuln-brand)';
        } else {
          chip.style.backgroundColor = 'var(--vuln-surface-2)';
          chip.style.color = 'var(--vuln-ink-2)';
          chip.style.borderColor = 'var(--vuln-line)';
        }
      }

      function syncChips() {
        var chips = document.querySelectorAll('.filter-chip');
        chips.forEach(function (chip) {
          var active = chip.getAttribute('data-severity') === state.severity;
          chip.classList.toggle('active', active);
          styleChip(chip);
        });
      }

      /* ---------- 详情弹窗 ---------- */
      function openModal(cweId) {
        var cwe = null;
        for (var i = 0; i < CWE_DATA.length; i++) {
          if (CWE_DATA[i].id === cweId) { cwe = CWE_DATA[i]; break; }
        }
        if (!cwe) return;

        var meta = SEVERITY_META[cwe.severity] || SEVERITY_META.info;

        document.getElementById('modal-cwe-id').textContent = cwe.id;

        var sevEl = document.getElementById('modal-cwe-sev');
        sevEl.textContent = meta.label;
        sevEl.className = 'severity-badge inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium ' + meta.badge;

        document.getElementById('modal-cwe-category').textContent = '· ' + cwe.category;
        document.getElementById('modal-cwe-title').textContent = cwe.name;
        document.getElementById('modal-cwe-desc').textContent = cwe.description;
        document.getElementById('modal-cwe-detection').textContent = cwe.detection;
        document.getElementById('modal-cwe-fix').textContent = cwe.fix;

        // 代码块通过 textContent 写入，天然防 XSS
        document.getElementById('modal-cwe-vuln-code').textContent = cwe.vulnCode.code;
        document.getElementById('modal-cwe-vuln-lang').textContent = cwe.vulnCode.lang;
        document.getElementById('modal-cwe-safe-code').textContent = cwe.safeCode.code;
        document.getElementById('modal-cwe-safe-lang').textContent = cwe.safeCode.lang;

        // 受影响语言
        var langsBox = document.getElementById('modal-cwe-langs');
        langsBox.innerHTML = langSpans(cwe.languages);

        $overlay.classList.add('open');
        $overlay.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }

      function closeModal() {
        $overlay.classList.remove('open');
        $overlay.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      /* ---------- 事件绑定 ---------- */
      // 搜索
      $search.addEventListener('input', function (e) {
        state.search = e.target.value;
        applyFilters();
      });

      // chip 筛选
      var chips = document.querySelectorAll('.filter-chip');
      chips.forEach(function (chip) {
        chip.addEventListener('click', function () {
          state.severity = chip.getAttribute('data-severity') || 'all';
          syncChips();
          applyFilters();
        });
      });

      // 卡片"查看详情"（事件委托）
      $grid.addEventListener('click', function (e) {
        var link = e.target.closest('.view-detail');
        if (link) {
          e.preventDefault();
          openModal(link.getAttribute('data-cwe-id'));
        }
      });

      // 弹窗关闭
      document.getElementById('modal-close').addEventListener('click', closeModal);
      $overlay.addEventListener('click', function (e) {
        if (e.target === $overlay) closeModal();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && $overlay.classList.contains('open')) {
          closeModal();
        }
      });

      /* ---------- 初始化 ---------- */
      renderCards();
      syncChips();
      applyFilters();

      /* ---------- 扫描历史检测标记 ---------- */
      // 从 localStorage 读取扫描历史，标记哪些 CWE 在最近扫描中被检测到
      function getDetectedCwes() {
        try {
          var raw = localStorage.getItem('vuln_scan_history');
          if (!raw) return {};
          var hist = JSON.parse(raw);
          if (!Array.isArray(hist)) return {};
          var detected = {};
          for (var i = 0; i < hist.length; i++) {
            var results = hist[i].results;
            if (!Array.isArray(results)) continue;
            for (var j = 0; j < results.length; j++) {
              if (results[j] && results[j].has_vulnerability === true) {
                var vt = String(results[j].vulnerability_type || '').toLowerCase();
                // 映射漏洞类型到 CWE ID
                for (var k = 0; k < CWE_DATA.length; k++) {
                  var cwe = CWE_DATA[k];
                  if (vt.indexOf(cwe.id.toLowerCase()) > -1 ||
                      vt.indexOf(cwe.name.toLowerCase()) > -1) {
                    detected[cwe.id] = (detected[cwe.id] || 0) + 1;
                  }
                }
              }
            }
          }
          return detected;
        } catch (e) { return {}; }
      }

      function applyDetectedBadges() {
        var detected = getDetectedCwes();
        var count = Object.keys(detected).length;
        if (count === 0) return;
        // 显示汇总
        var summary = document.getElementById('detected-summary');
        if (summary) {
          summary.textContent = '最近扫描中发现 ' + count + ' 类 CWE';
          summary.classList.remove('hidden');
          summary.style.color = 'var(--vuln-state-error)';
        }
        // 在卡片上添加检测标记
        var cards = $grid.querySelectorAll('.cwe-card');
        cards.forEach(function (card) {
          var cweId = card.getAttribute('data-cwe-id');
          if (detected[cweId]) {
            var badge = document.createElement('span');
            badge.className = 'inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full text-xs font-medium bg-[var(--vuln-state-error)]/10 text-[var(--vuln-state-error)] border border-[var(--vuln-state-error)]/20';
            badge.style.marginLeft = '6px';
            badge.textContent = '近期发现 ' + detected[cweId] + ' 次';
            var idSpan = card.querySelector('.font-mono.text-xs');
            if (idSpan) idSpan.parentElement.appendChild(badge);
          }
        });
      }

      applyDetectedBadges();
      loadDemoManifest();
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        try { window.lucide.createIcons(); } catch (e) {}
      }

      /* ---------- 快速演示链接 ---------- */
      var demoManifest = null;
      function loadDemoManifest() {
        fetch('/samples/demo/manifest.json')
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(function (data) {
            demoManifest = data;
            applyDemoLinks();
          })
          .catch(function (err) { console.error('CWE demo manifest', err); });
      }
      function applyDemoLinks() {
        if (!demoManifest || !demoManifest.samples) return;
        var byCwe = {};
        demoManifest.samples.forEach(function (s) {
          var cwe = s.expected_cwe;
          if (!cwe || cwe === 'N/A') return;
          if (!byCwe[cwe]) byCwe[cwe] = [];
          byCwe[cwe].push(s);
        });
        var cards = document.querySelectorAll('.cwe-card');
        cards.forEach(function (card) {
          var cweId = card.getAttribute('data-cwe-id');
          var list = byCwe[cweId];
          if (!list || !list.length) return;
          var footer = card.querySelector('.view-detail');
          if (!footer) return;
          var link = document.createElement('a');
          link.href = './scan.html?demo=' + encodeURIComponent(list[0].file);
          link.className = 'demo-link inline-flex items-center gap-1 text-xs font-medium text-[var(--vuln-brand)] hover:text-[var(--vuln-brand-300)] transition-colors ml-3';
          link.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>快速演示' + (list.length > 1 ? ' (' + list.length + ')' : '');
          footer.parentNode.appendChild(link);
        });
      }
    })();
  </script>
<link rel="stylesheet" href="./lively.css">
<script src="./lively.js" defer></script>
<script src="./theme.js" defer></script>
</body>
