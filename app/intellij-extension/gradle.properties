# Gradle 网络配置
# 从源码构建 IntelliJ 插件时，首次运行需要下载 IntelliJ Platform SDK（约 1GB）。
# 如果你的网络环境需要走本地代理（例如 Clash 默认端口 7897），请取消下面四行注释，
# 并按实际端口修改；无需代理（含 CI / 赛场环境）时请保持注释——
# 指向不存在的本地代理会让 Gradle 下载直接连接失败。
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7897
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7897
# systemProp.http.nonProxyHosts=localhost|127.0.0.1
# systemProp.https.nonProxyHosts=localhost|127.0.0.1

# 阿里云 Maven 镜像已在 build.gradle.kts 中配置（国内网络加速依赖下载）。
# 如需在此处覆盖仓库地址，可取消下面注释：
# systemProp.maven.repo.remote=https://maven.aliyun.com/repository/public
