<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/* ======================================================================
   VulnScanner Premium — 克制版设计 Token
   设计哲学：专业的安全工具应该是隐形的。数据 > 装饰。
   灵感：Stripe Dashboard 的数据密度与留白、Linear 的动效克制、
         Vercel 的极简美学。
   关键改进：
   1. 排版拉差 — Display 56px / Headline 28px / Body 15px / Caption 12px
   2. 卡片层次靠透明度梯度，而非全同级玻璃
   3. 动效收敛 — 仅评分环呼吸，卡片微 hover，无 3D 倾斜/无 idle 浮动
   4. 间距放开 — 8px 基准，区块 32px，卡片间 20px
   5. 色彩收敛 — 状态色仅用左边框/圆点/icon，主色仅给 CTA 与激活态
   ====================================================================== */

:root {
  /* === 中性色阶 — 浅色模式（白纸分析感） === */
  --vuln-bg: #ffffff;
  --vuln-surface: #ffffff;
  --vuln-surface-2: #f7f8fa;
  --vuln-surface-3: #eef0f3;
  --vuln-ink: #0b0f14;
  --vuln-ink-2: #5a6573;
  --vuln-ink-3: #9aa4b2;
  --vuln-line: #e4e7ec;
  --vuln-line-2: #f0f2f5;

  /* === 品牌主色 — Google Blue（浅色） === */
  --vuln-brand: #4285f4;
  --vuln-brand-ink: #ffffff;
  --vuln-brand-50: #eff6ff;
  --vuln-brand-100: #dbeafe;
  --vuln-brand-600: #2563eb;
  --vuln-brand-700: #1d4ed8;

  /* === 语义状态色 — 仅用于左边框/圆点/icon === */
  --vuln-state-success: #34a853;
  --vuln-state-warning: #f9ab00;
  --vuln-state-error: #ea4335;
  --vuln-state-info: #4285f4;

  /* === 语义别名（head contract 必需） === */
  --vuln-background: var(--vuln-bg);
  --vuln-foreground: var(--vuln-ink);
  --vuln-card: var(--vuln-surface);
  --vuln-card-foreground: var(--vuln-ink);
  --vuln-popover: var(--vuln-surface-2);
  --vuln-popover-foreground: var(--vuln-ink);
  --vuln-primary: var(--vuln-brand);
  --vuln-primary-foreground: var(--vuln-brand-ink);
  --vuln-muted: var(--vuln-surface-2);
  --vuln-muted-foreground: var(--vuln-ink-2);
  --vuln-border: var(--vuln-line);
  --vuln-input: #d8dce2;
  --vuln-ring: var(--vuln-brand);

  /* === 圆角阶 === */
  --vuln-radius-sm: 6px;
  --vuln-radius-md: 10px;
  --vuln-radius-lg: 14px;

  /* === 间距阶 — 8px 基准网格 === */
  --vuln-space-xs: 4px;
  --vuln-space-sm: 8px;
  --vuln-space-md: 16px;
  --vuln-space-lg: 24px;
  --vuln-space-xl: 32px;
  --vuln-space-2xl: 48px;
  --vuln-space-3xl: 80px;

  /* === 字体 === */
  --vuln-font-sans: "DM Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
  --vuln-font-mono: "JetBrains Mono", "Cascadia Code", Consolas, Monaco, monospace;

  /* === 排版阶 — 拉大对比 === */
  --vuln-text-display: 56px;
  --vuln-text-display-weight: 700;
  --vuln-text-display-tracking: -0.03em;
  --vuln-text-headline: 28px;
  --vuln-text-headline-weight: 600;
  --vuln-text-headline-tracking: -0.01em;
  --vuln-text-body: 15px;
  --vuln-text-body-weight: 400;
  --vuln-text-caption: 12px;
  --vuln-text-caption-weight: 400;

  /* === 阴影 — 三级，扁平边框主导 === */
  --vuln-shadow-1: 0 1px 2px rgba(11, 15, 20, 0.04);
  --vuln-shadow-2: 0 2px 8px rgba(11, 15, 20, 0.06);
  --vuln-shadow-3: 0 8px 24px rgba(11, 15, 20, 0.08);

  /* === 卡片透明度梯度 — 层级靠此建立 === */
  --vuln-card-opacity-primary: 0.88;
  --vuln-card-opacity-secondary: 0.55;
  --vuln-card-opacity-tertiary: 0.3;
  --vuln-card-blur: 20px;

  /* === 动效 — 收敛 === */
  --vuln-ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
  --vuln-ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
  --vuln-dur-fast: 150ms;
  --vuln-dur-normal: 250ms;
  --vuln-dur-slow: 400ms;
}

/* === 深色模式 — 编辑级高对比（产品默认） === */
.dark {
  --vuln-bg: #0d0d0d;
  --vuln-surface: #161616;
  --vuln-surface-2: #1e1e1e;
  --vuln-surface-3: #282828;
  --vuln-ink: #f0f1f3;
  --vuln-ink-2: #8b8b8b;
  --vuln-ink-3: #5c5c5c;
  --vuln-line: #2a2a2a;
  --vuln-line-2: #222222;

  --vuln-brand: #fc2c50;
  --vuln-brand-ink: #ffffff;
  --vuln-brand-50: #3a1a22;
  --vuln-brand-100: #4d2129;
  --vuln-brand-600: #ff4d6d;
  --vuln-brand-700: #ff6b85;

  --vuln-state-success: #3dd68c;
  --vuln-state-warning: #fbbf24;
  --vuln-state-error: #f1204a;
  --vuln-state-info: #38bdf8;

  --vuln-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
  --vuln-shadow-2: 0 2px 8px rgba(0, 0, 0, 0.4);
  --vuln-shadow-3: 0 8px 24px rgba(0, 0, 0, 0.5);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--vuln-background);
    --color-foreground: var(--vuln-foreground);
    --color-card: var(--vuln-card);
    --color-card-foreground: var(--vuln-card-foreground);
    --color-popover: var(--vuln-popover);
    --color-popover-foreground: var(--vuln-popover-foreground);
    --color-primary: var(--vuln-primary);
    --color-primary-foreground: var(--vuln-primary-foreground);
    --color-muted: var(--vuln-muted);
    --color-muted-foreground: var(--vuln-muted-foreground);
    --color-border: var(--vuln-border);
    --color-input: var(--vuln-input);
    --color-ring: var(--vuln-ring);
    --radius-sm: var(--vuln-radius-sm);
    --radius-md: var(--vuln-radius-md);
    --radius-lg: var(--vuln-radius-lg);
  }
  @layer base {
    body { background: var(--vuln-background); color: var(--vuln-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .border-popover-foreground { border-color: var(--vuln-popover-foreground); }

      .bg-primary { background-color: var(--vuln-primary); }
      .text-primary { color: var(--vuln-primary); }

      .bg-border { background-color: var(--vuln-border); }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
