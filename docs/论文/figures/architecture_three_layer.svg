<svg viewBox="0 0 720 470" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#8a8a94"/>
    </marker>
    <marker id="arb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="720" height="470" fill="#ffffff"/>

  <!-- 区块标签 -->
  <text x="44" y="34" fill="#8a8a94" font-size="12">现有架构</text>
  <rect x="44" y="42" width="632" height="52" rx="10" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/>
  <text x="44" y="112" fill="#7c3aed" font-size="12" font-weight="600">新增验证层</text>

  <!-- 现有管道节点 -->
  <rect x="64" y="56" width="120" height="34" rx="8" fill="#ffffff" stroke="#c9c9d1" stroke-width="1.5"/>
  <text x="124" y="78" text-anchor="middle" fill="#3a3a42" font-size="13">代码输入</text>

  <rect x="224" y="56" width="150" height="34" rx="8" fill="#ffffff" stroke="#c9c9d1" stroke-width="1.5"/>
  <text x="299" y="78" text-anchor="middle" fill="#3a3a42" font-size="13">Stage 1 工具召回</text>

  <!-- 激活引导（可选）虚线框 -->
  <rect x="404" y="48" width="190" height="50" rx="10" fill="none" stroke="#e879f9" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.7"/>
  <text x="499" y="44" text-anchor="middle" fill="#e879f9" font-size="11">激活引导（可选）Layer 3</text>

  <rect x="414" y="56" width="170" height="34" rx="8" fill="#ffffff" stroke="#c9c9d1" stroke-width="1.5"/>
  <text x="499" y="78" text-anchor="middle" fill="#3a3a42" font-size="13">Stage 2 LLM 裁决(N=5)</text>

  <!-- 现有管道连接线 -->
  <path d="M 184 73 L 220 73" fill="none" stroke="#8a8a94" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M 374 73 L 410 73" fill="none" stroke="#8a8a94" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Stage 2 → 共形预测 -->
  <path d="M 499 94 L 499 122 L 370 122 L 370 138" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arb)"/>

  <!-- Layer 1: 共形预测 -->
  <rect x="280" y="142" width="180" height="38" rx="8" fill="#f3eefe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="370" y="166" text-anchor="middle" fill="#7c3aed" font-size="13" font-weight="600">Layer 1 共形预测校准</text>

  <!-- 共形 → 三分支 -->
  <path d="M 370 180 C 370 196, 145 200, 145 214" fill="none" stroke="#8a8a94" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M 370 180 L 370 214" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arb)"/>
  <path d="M 370 180 C 370 196, 595 200, 595 214" fill="none" stroke="#8a8a94" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- {漏洞} 确认 -->
  <rect x="75" y="218" width="140" height="36" rx="8" fill="#f5f5f7" stroke="#c9c9d1" stroke-width="1.5"/>
  <text x="145" y="241" text-anchor="middle" fill="#3a3a42" font-size="12">{漏洞} 自动确认</text>

  <!-- {不确定} + Layer 2 -->
  <rect x="300" y="218" width="140" height="36" rx="8" fill="#f3eefe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="370" y="241" text-anchor="middle" fill="#7c3aed" font-size="12" font-weight="600">{不确定}</text>

  <!-- {安全} 放行 -->
  <rect x="525" y="218" width="140" height="36" rx="8" fill="#f5f5f7" stroke="#c9c9d1" stroke-width="1.5"/>
  <text x="595" y="241" text-anchor="middle" fill="#3a3a42" font-size="12">{安全} 自动放行</text>

  <!-- {不确定} → 反事实扰动 -->
  <path d="M 370 254 L 370 288" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arb)"/>

  <!-- Layer 2: 反事实扰动验证 -->
  <rect x="290" y="292" width="160" height="38" rx="8" fill="#f3eefe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="370" y="316" text-anchor="middle" fill="#7c3aed" font-size="13" font-weight="600">Layer 2 反事实扰动</text>

  <!-- 反事实 → 两个结果 -->
  <path d="M 370 330 C 370 348, 275 352, 275 366" fill="none" stroke="#8a8a94" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M 370 330 C 370 348, 475 352, 475 366" fill="none" stroke="#8a8a94" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 结果 -->
  <rect x="195" y="370" width="160" height="36" rx="8" fill="#eef7ee" stroke="#4a9d5b" stroke-width="1.5"/>
  <text x="275" y="393" text-anchor="middle" fill="#2f7d3e" font-size="12">翻转 → 真阳性</text>

  <rect x="385" y="370" width="180" height="36" rx="8" fill="#fdf0ef" stroke="#d05a4e" stroke-width="1.5"/>
  <text x="475" y="393" text-anchor="middle" fill="#b03a2e" font-size="12">不翻转 → 可疑 FP</text>

  <!-- 底部总结 -->
  <rect x="150" y="428" width="420" height="30" rx="8" fill="#0f172a"/>
  <text x="360" y="448" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">校准 → 筛选 → 因果验证</text>
</svg>