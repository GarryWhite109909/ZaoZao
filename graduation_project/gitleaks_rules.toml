# Gitleaks 自定义规则（2026-08-29，工具层优化指导 §二 B2）
#
# 背景：修复 B1（secret 档接入 + --no-git）后，typical_06 / typical_18 仍零召回，
# 原因是默认规则集的语义盲区：
#   - generic-api-key 未覆盖 AWS Access Key ID 的 AKIA 前缀形态；
#   - Python 字节串字面量赋值（SECRET_KEY = b"..."）不在任何默认规则的形态内。
#
# [extend] useDefault = true：在默认规则集之上追加（不替换），默认规则照常生效。
# 泛化纪律（对照指导文档 §五之二三关卡）：
#   1. 语言级事实 —— b"..." 是 Python 字节串字面量的唯一语法；AKIA+16位大写字母
#      数字是 AWS 官方 Access Key ID 格式；均为工具/API 的规范形态，非样本拼写。
#   2. 形态抽象 —— 匹配「凭证语义命名的标识符 ← 字节串字面量」结构，不匹配
#      具体变量名；AWS 规则只认官方前缀格式。
#   3. 独立集验证 —— 87 段全量 + safe/noise 子集零误伤（见指导文档验证记录）。

[extend]
useDefault = true

[[rules]]
id = "aws-access-key-id"
description = "AWS Access Key ID literal (AKIA/ASIA/ABIA/ACCA + 16 chars)"
regex = '''\b(A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16}\b'''
tags = ["aws", "key", "CWE-798"]

[[rules]]
id = "python-bytes-literal-secret"
description = "Hardcoded secret assigned as Python bytes literal"
regex = '''(?i)\b[\w-]*(?:secret|token|password|passwd|api[_-]?key|credential|access[_-]?key|private[_-]?key)[\w-]*\s*=\s*b['"][^'"]{8,}['"]'''
tags = ["python", "secret", "CWE-798"]
