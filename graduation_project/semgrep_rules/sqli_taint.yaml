# SQL 注入污点规则 —— 两阶段架构 Stage 1（工具召回）。
#
# 说明：
# - mode: taint 让 semgrep 对"整文件"做单文件内跨函数的 source→sink 追踪，
#   修复了长文件切片后 chunk A 的 source 与 chunk B 的 sink 被割裂的问题。
# - pattern-sources：用户可控输入点；pattern-sinks：SQL 执行点。
# - semgrep 会自动向 finding 的 extra.metavars 注入 $SOURCE / $SINK，
#   external_scanner.scan_taint() 据此提取实际 source/sink 表达式与行号。
# - 本规则只做"召回"，不做"终判"：即使命中也交由 Stage 2 LLM 裁决层
#   判定是否真漏洞（参数化查询等有效防御会由裁决层识别并放行）。
# - 结构性安全建模（2026-09-05，基线对账驱动）：sink 只取**查询文本（首参）**。
#   参数化查询（DB-API 第二实参传参元组）在构造上安全——数据与 SQL 文本
#   分列两个实参、由驱动做值绑定，不含语义判断；官方规则同样以
#   focus-metavariable 只把查询文本作 sink。此前 sink 匹配整调用，污点流入
#   参数元组也命中，safe_01/05/07、noise_01/02 五个参数化样本全部误报
#   （纯工具口径混跑 FPR 46.2% vs 官方 23.1% 的全部增量即此）。
#   语义性防御（replace/strip/校验后拼接）仍不建模——可绕过（hard_bypass
#   系列实证），交 Stage 2 裁决层。
# - taint_assume_safe_functions:false 表示"不假定库函数消毒"（2026-08-08 实测
#   true 会把 os.path.join 等当消毒点切断污点链，造成真实 CVE 漏报）；
#   真实消毒函数在 pattern-sanitizers 显式声明。文件内跨函数召回由
#   TaintTracker 的过程间摘要兜底，两者互补。
rules:
  - id: python-sqli-taint
    mode: taint
    message: "污点命中：用户可控输入流入 SQL 执行，疑似 SQL 注入（待 LLM 裁决）"
    severity: ERROR
    languages: [python]
    pattern-sources:
      # Flask / Django / 通用 WSGI 输入
      - pattern: request.GET.get(...)
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.POST.get(...)
      - pattern: request.values.get(...)
      - pattern: request.json
      - pattern: request.data
      - pattern: request.cookies
      - pattern: request.COOKIES
      - pattern: request.headers
      - pattern: request.META
      # 命令行 / 环境变量 / 标准输入
      - pattern: input(...)
      - pattern: sys.argv
      - pattern: os.environ
      - pattern: os.environ.get(...)
      # Web 框架路由路径参数（@app.route("/x/<id>") 绑定的形参同样是用户可控输入；
      # 2026-08-08 实测 cve_fix_0009 的 charge_id 路径参数 SQLi 曾因缺此 source 漏报）
      - patterns:
          - pattern-inside: |
              @$APP.$METHOD(...)
              def $F(..., $PARAM, ...):
                ...
          - pattern: $PARAM
    pattern-sinks:
      # DB-API / SQLAlchemy——sink 只取查询文本（首参，focus-metavariable）：
      # 参数化传参（第二实参元组）在构造上安全，不构成 sink（见文件头注释）
      - patterns:
          - pattern-either:
              - pattern: cursor.execute($Q, ...)
              - pattern: cursor.executemany($Q, ...)
              - pattern: connection.execute($Q, ...)
              - pattern: db.execute($Q, ...)
              - pattern: execute_query($Q, ...)
              - pattern: execute_update($Q, ...)
              - pattern: session.execute($Q, ...)
              - pattern: engine.execute($Q, ...)
              - pattern: conn.execute($Q, ...)
          - focus-metavariable: $Q
    pattern-sanitizers:
      # 真实消毒/类型收敛函数（显式声明；其余库函数不假定安全，见 options 注释）
      - pattern: int(...)
      - pattern: float(...)
      - pattern: shlex.quote(...)
    options:
      # false = 不假定库函数消毒（原为 true，会把 str 处理/拼接辅助函数当成
      # 消毒点切断污点链造成漏报）。两阶段架构允许工具高 FPR、由裁决层抑制；
      # 真正的消毒函数在 pattern-sanitizers 显式声明。
      # 文件内跨函数召回由 TaintTracker 的过程间摘要兜底，两者互补。
      taint_assume_safe_functions: false
      taint_assume_safe_comparisons: true
