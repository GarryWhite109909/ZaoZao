# Go 命令注入：shell 解释器执行（2026-09-01 补，§9.27）
#
# 补位原因（B 层"追加自定义规则"的典型案例）：
# 官方 registry 已有 go.lang.security.audit.dangerous-exec-cmd（CWE-94），
# 但它**只匹配 exec.Cmd{...} 结构体字面量**，完全不匹配 exec.Command(...)
# 函数调用形态——而后者才是 Go 最主流的写法。语料池实测：
#   exec.Command(  4 个样本
#   exec.Cmd{      0 个样本
# 即官方规则覆盖的恰恰是语料里不存在的形态，导致 Go 命令注入实质零覆盖。
# 本文件不编辑官方规则，只在之上追加（与 gitleaks_rules.toml 同一手法）。
#
# 检测对象：通过 shell 解释器执行字符串命令的形态。
#   exec.Command("sh", "-c", cmd)            # POSIX
#   exec.Command("bash", "-c", cmd)          # POSIX
#   exec.Command("cmd", "/c", cmd)           # Windows
#   exec.CommandContext(ctx, "sh", "-c", cmd)
#   exec.Command("powershell", ..., "-Command", cmd)   # Windows PowerShell
# 这类调用的危害与参数来源无关：只要命令串经过 shell，shell 元字符
# （; && | $() 等）即可被注入。**shell 解释器标志本身就是危险信号**，
# 因此用普通形态规则（非 taint），不依赖 source 追踪。
#
# 泛化三关自检：
#   ① 语言级事实：sh -c / cmd /c / powershell -Command 是 POSIX 与 Windows
#      的标准 shell 调用约定，不是某个项目的专有 API 名。
#   ② 结构特征非拼写：检测的是「shell 解释器程序 + 执行标志」的组合结构，
#      而非某个字面量；仅写死 shell 程序名是必要的（它们就是那几个）。
#   ③ 多语言变体：同语义形态存在于 Python subprocess(..., shell=True)、
#      JS child_process.exec()、PHP shell_exec()、Java Runtime.exec("sh -c")。
#
# 不覆盖（保持高精度，宁可漏不可滥）：
#   exec.Command(cmd[0], cmd[1:]...) 数组形式且无 shell —— gosec G204 会报，
#   但需要判断 cmd 是否用户可控，属数据流分析域，交给 Stage 2 裁决层。
#   语料中 corpus_00177/00181 即此形态（source 是 YAML 配置字段），
#   形态规则原理上无从判别（见 §9.24）。
rules:
  - id: go-cmdi-shell-interpreter
    languages: [go]
    message: >-
      命令执行：通过 shell 解释器（sh/bash -c、cmd /c、powershell -Command）
      执行字符串命令，命令串中的 shell 元字符可被注入（CWE-78）。
      改用 exec.Command 数组形式（exec.Command(prog, arg1, arg2)）避免 shell 解析。
    severity: ERROR
    metadata:
      cwe: "CWE-78"
      category: command-injection
      confidence: HIGH
      note: "补官方 dangerous-exec-cmd 只覆盖 exec.Cmd{} 的缺口"
    pattern-either:
      # POSIX shell（-c = 从字符串读取命令）
      - pattern: exec.Command("sh", "-c", ...)
      - pattern: exec.Command("bash", "-c", ...)
      - pattern: exec.Command("zsh", "-c", ...)
      - pattern: exec.Command("ksh", "-c", ...)
      - pattern: exec.Command("/bin/sh", "-c", ...)
      - pattern: exec.Command("/bin/bash", "-c", ...)
      - pattern: exec.Command("/bin/zsh", "-c", ...)
      # Windows cmd（/c = 执行后终止）
      - pattern: exec.Command("cmd", "/c", ...)
      - pattern: exec.Command("cmd.exe", "/c", ...)
      # Windows PowerShell（-Command / 缩写 -c 均执行字符串命令）
      - pattern: exec.Command("powershell", ..., "-Command", ...)
      - pattern: exec.Command("powershell.exe", ..., "-Command", ...)
      - pattern: exec.Command("pwsh", ..., "-Command", ...)
      # 带 context 的同族形态
      - pattern: exec.CommandContext($CTX, "sh", "-c", ...)
      - pattern: exec.CommandContext($CTX, "bash", "-c", ...)
      - pattern: exec.CommandContext($CTX, "zsh", "-c", ...)
      - pattern: exec.CommandContext($CTX, "/bin/sh", "-c", ...)
      - pattern: exec.CommandContext($CTX, "/bin/bash", "-c", ...)
      - pattern: exec.CommandContext($CTX, "cmd", "/c", ...)
      - pattern: exec.CommandContext($CTX, "cmd.exe", "/c", ...)
      - pattern: exec.CommandContext($CTX, "powershell", ..., "-Command", ...)
      - pattern: exec.CommandContext($CTX, "powershell.exe", ..., "-Command", ...)
      - pattern: exec.CommandContext($CTX, "pwsh", ..., "-Command", ...)
