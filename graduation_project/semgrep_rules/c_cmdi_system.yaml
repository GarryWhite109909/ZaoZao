# C 命令注入：非常量命令串执行（2026-09-20 补）
#
# 补位原因（语言审计实测）：security-audit 包的 C 规则（9 条）全部面向
# 内存安全（格式化串/随机数/竞争），命令注入零覆盖。
#
# 官方背书：CERT C Coding Standard POS30-C —— "Do not use the system()
# function"：system() 经 shell 解释命令串，建议改用 execv 族且首个参数
# 为常量路径。CWE-78 的 demonstrative example 亦即 argv 入 system() 形态。
#
# 检测对象（结构化规则，非 taint）：
#   system(cmd) / popen(cmd, mode) / execvp(cmd, ...) / execlp(cmd, ...)
#   且命令串**不是字符串字面量**（变量/数组内容，运行期才确定）。
#   taint 模式在此不适用的原因：C 的典型链经 snprintf(cmd,...,argv[1])
#   out-param 写入，semgrep taint 无法跨函数参数传播（语言固有）。
#   非常量命令串交给 Stage 2 裁决：LLM 看得到 cmd 的构建处与来源。
#
# 泛化三关自检：
#   ① 语言级事实：system/popen 是 ISO C 与 POSIX 标准函数名，无第二语义；
#      CERT POS30-C 对"非常量命令串"的风险界定即本规则的判据。
#   ② 结构特征非拼写：检测「执行族 API + 非字面量命令」组合结构，
#      不匹配任何具体变量名/项目拼写。
#   ③ 多语言变体：Python(os.system 拼接)/PHP(system)/Java(Runtime.exec)
#      已由各自通道覆盖，本文件补齐 C 侧同语义形态。
#
# 不覆盖（保持高精度）：
#   system("ls -la") 全字面量调用（无注入面，pattern-not 排除）；
#   fork+exec 手工组装、wordexp——形态罕见，宁漏勿滥。
rules:
  - id: c-cmdi-nonliteral-command
    languages: [c]
    message: >-
      命令注入风险（CWE-78 / CERT POS30-C）：system/popen/execvp/execlp
      执行非常量命令串，命令内容经 shell 解释（system/popen）或运行期才
      确定（exec 族）。若命令串含外部可控数据（argv/环境变量/文件输入），
      shell 元字符（; && | $()）可被注入。改用 execv 族 + 常量程序路径 +
      参数数组传递。
    severity: ERROR
    metadata:
      cwe: "CWE-78"
      category: command-injection
      confidence: MEDIUM
      note: "补 security-audit 包 C 规则只覆盖内存安全的缺口；命令来源由 Stage 2 裁决"
    patterns:
      - pattern-either:
          - pattern: system($CMD)
          - pattern: popen($CMD, $MODE)
          - pattern: execvp($CMD, ...)
          - pattern: execlp($CMD, ...)
      # 全字面量命令串无注入面，排除（CERT POS30-C 的风险界定是"运行期才
      # 确定的命令内容"）；semgrep 无 pattern-not-either，多个否定并列书写
      - pattern-not: system("...")
      - pattern-not: popen("...", $MODE)
      - pattern-not: execvp("...", ...)
      - pattern-not: execlp("...", ...)
