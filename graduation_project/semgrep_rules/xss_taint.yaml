# 反射型 XSS 污点规则 —— 两阶段架构 Stage 1（工具召回）。
#
# 说明：
# - mode: taint 让 semgrep 对"整文件"做单文件内跨函数的 source→sink 追踪，
#   修复长文件切片后 source 与 sink 被割裂导致 XSS 漏报的问题。
# - pattern-sources：用户可控输入点（Flask/Django/通用 WSGI）；pattern-sinks：
#   未转义字符串渲染为 HTML 响应体（f-string 插值、% 格式化、Jinja2 模板）。
# - 本规则只做"召回"，不做"终判"：即使命中也交由 Stage 2 LLM 裁决层判定是否
#   真漏洞（html.escape / Markup / render_template 等有效防御由裁决层识别并放行）。
# - 简单 replace("<script>","") 过滤不算消毒：它只删恰好匹配的写法，可被大小写、
#   嵌套、事件属性等绕过，故不列入 pattern-sanitizers，交由 LLM 裁决时识别。
# - taint_assume_safe_functions:false：不假定库函数消毒（与 sqli/cmdi 规则一致），
#   真实消毒函数在 pattern-sanitizers 显式声明。
rules:
  - id: python-xss-taint
    mode: taint
    message: "污点命中：用户可控输入流入未转义的 HTML/CSS 输出，疑似反射型 XSS（待 LLM 裁决）"
    severity: ERROR
    languages: [python]
    pattern-sources:
      # Flask / Django / 通用 WSGI 输入
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.values.get(...)
      - pattern: request.POST.get(...)
      - pattern: request.GET.get(...)
      - pattern: request.cookies
      - pattern: request.COOKIES
      - pattern: request.headers
      - pattern: request.data
      - pattern: request.json
      - pattern: request.get_json(...)
      # 命令行 / 环境变量 / 标准输入
      - pattern: input(...)
      - pattern: sys.argv
      - pattern: os.environ
      - pattern: os.environ.get(...)
    pattern-sinks:
      # 未转义字符串渲染为 HTML 响应体（f-string 插值）
      - pattern: 'return f"..."'
      - pattern: "return f'...'"
      # Jinja2 / 模板字符串 / 结构化输出
      - pattern: render_template_string(...)
      - pattern: Markup(...)
      - pattern: make_response(...)
      # % 格式化 / str.format 拼 HTML
      - pattern: 'return "..." % (...)'
      - pattern: 'return "...".format(...)'
    pattern-sanitizers:
      # 真实消毒/转义函数（其余库函数不假定安全，见 options 注释）
      - pattern: html.escape(...)
      - pattern: escape(...)
      - pattern: Markup.escape(...)
      - pattern: bleach.clean(...)
      - pattern: markupsafe.escape(...)
    options:
      # false = 不假定库函数消毒；真正消毒函数在 pattern-sanitizers 显式声明。
      # 两阶段架构允许工具高 FPR、由裁决层抑制误报。
      taint_assume_safe_functions: false
      taint_assume_safe_comparisons: true